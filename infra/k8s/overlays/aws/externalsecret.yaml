# Syncs the "fiapx/app" secret from AWS Secrets Manager (created by Terraform)
# into a Kubernetes Secret named fiapx-secrets. The JSON keys in Secrets Manager
# (POSTGRES_DSN, JWT_SECRET) become keys in the Secret, which the services already
# consume via `envFrom: secretRef: fiapx-secrets`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fiapx-secrets
  namespace: fiapx
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: fiapx-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: fiapx/app
