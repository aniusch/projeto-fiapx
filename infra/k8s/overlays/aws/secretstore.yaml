# External Secrets Operator store pointing at AWS Secrets Manager.
#
# No `auth` block is set, so ESO uses the credentials of its own controller pod
# — which, without IRSA (unavailable in Learner Lab), is the EKS node role
# (LabRole) obtained via IMDS. That requires the node launch template's IMDS hop
# limit of 2 (see infra/terraform/modules/eks).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: fiapx
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
