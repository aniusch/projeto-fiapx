# Runs the database migrations once, before the app services need the schema.
# The SQL files come from the "migrations" ConfigMap generated by kustomize from
# the repo's migrations/ directory.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 10
  template:
    metadata:
      labels: { app: migrate }
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: migrate
          image: migrate/migrate:v4.17.1
          env:
            - name: POSTGRES_DSN
              valueFrom: { secretKeyRef: { name: fiapx-secrets, key: POSTGRES_DSN } }
          command: ["/bin/sh", "-c"]
          args:
            - migrate -path=/migrations -database="$POSTGRES_DSN" up
          volumeMounts:
            - name: migrations
              mountPath: /migrations
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: migrations
          configMap:
            name: migrations
