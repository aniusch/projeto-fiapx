global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # The gateway exposes /metrics on its main HTTP port.
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]

  # The worker and notifier expose /metrics on a dedicated metrics port.
  # DNS discovery resolves every replica, so `--scale worker=N` is scraped fully
  # (a static target would only ever hit one of them).
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9101

  - job_name: notifier
    static_configs:
      - targets: ["notifier:9101"]

  # RabbitMQ's built-in Prometheus plugin, per-queue depth. This is where a
  # traffic spike becomes visible: it piles up here instead of being dropped.
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: ["queue_coarse_metrics", "queue_consumer_count"]
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
