# Local development infrastructure for FIAP X.
#
# Brings up every backing service the application needs, plus a one-shot job that
# applies the SQL migrations. The application services (gateway/worker/notifier)
# run on the host via `go run ./cmd/...` during development and connect to these
# containers on localhost. They get added to this file once their images exist.
#
#   docker compose up -d        # start infra + run migrations
#   docker compose down         # stop (add -v to also wipe data volumes)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fiapx
      POSTGRES_PASSWORD: fiapx
      POSTGRES_DB: fiapx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiapx -d fiapx"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies migrations, then exits. Other services can wait on it completing.
  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://fiapx:fiapx@postgres:5432/fiapx?sslmode=disable"
      - "up"
    restart: on-failure

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # management UI (guest/guest)
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - miniodata:/data

  # Waits for MinIO, then creates the bucket. Idempotent, so re-runs are safe.
  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          echo 'waiting for minio...'; sleep 1;
        done
        mc mb --ignore-existing local/fiapx-videos
        echo 'minio bucket ready'

  # The video-processing worker. Built from source; ffmpeg is baked into its
  # image. Scale it with `docker compose up -d --scale worker=3`.
  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    # The worker is stateless: it reads/writes object storage and RabbitMQ only,
    # and reports status via events. It never touches Postgres.
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      APP_ENV: development
      LOG_LEVEL: info
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      S3_ENDPOINT: minio:9000
      S3_BUCKET: fiapx-videos
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_SSL: "false"
      WORK_DIR: /tmp
      WORKER_CONCURRENCY: "3"
      PROCESSING_FPS: "1"
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      HTTP_PORT: "8080"
      POSTGRES_DSN: postgres://fiapx:fiapx@postgres:5432/fiapx?sslmode=disable
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      S3_ENDPOINT: minio:9000
      # Download URLs are signed for this host, which the browser can reach.
      S3_PUBLIC_ENDPOINT: localhost:9000
      S3_BUCKET: fiapx-videos
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_SSL: "false"
      JWT_SECRET: dev-insecure-secret-change-me
    ports:
      - "8080:8080"
    restart: unless-stopped

  notifier:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: notifier
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      APP_ENV: development
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: no-reply@fiapx.local
      METRICS_ADDR: ":9101"
    restart: unless-stopped

  # Mailpit is a dev SMTP server: catches all outbound mail and shows it in a UI.
  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    environment:
      MP_MAX_MESSAGES: "500"

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  rabbitmqdata:
  grafanadata:
