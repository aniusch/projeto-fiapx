sonar.projectKey=projeto_fiapx
sonar.organization=mecanica-fiap-tc
sonar.projectName=FIAP X

# Analyze the Go sources; treat *_test.go as test code (not sources).
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.sourceEncoding=UTF-8

# The legacy base project is the deliberately-bad "before" and isn't analyzed.
sonar.exclusions=legacy/**,**/*_test.go

# Go coverage, produced by `go test -coverprofile=coverage.out ./...`.
sonar.go.coverage.reportPaths=coverage.out

# Entry points (wiring) and the legacy base aren't held to a coverage bar.
sonar.coverage.exclusions=cmd/**,legacy/**
